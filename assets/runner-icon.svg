<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9f1c"/>
      <stop offset="1" stop-color="#f3395b"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#7a0d24" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px body inside 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  <g filter="url(#sh)" fill="#fff">
    <!-- speed lines -->
    <rect x="218" y="376" width="190" height="44" rx="22"/>
    <rect x="178" y="490" width="230" height="44" rx="22" opacity=".9"/>
    <rect x="238" y="604" width="170" height="44" rx="22" opacity=".8"/>
    <!-- play triangle, rounded, leaning forward -->
    <path d="M452 318 Q452 268 497 291 L790 468 Q832 494 790 520 L497 697 Q452 724 452 674 Z"
          transform="skewX(-8) translate(70 0)"/>
  </g>
</svg>
